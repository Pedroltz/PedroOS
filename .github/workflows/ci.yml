name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install npm dependencies
        run: npm ci

      - name: Generate pixel icons and assets
        run: npm run icons

      - name: Build frontend bundle
        run: npm run build

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Lint Frontend
        run: npm run lint

      - name: Run Client Unit Tests
        run: npm run test:client

      - name: Restore .NET Solution
        run: dotnet restore PedroOS.slnx

      - name: Build .NET Solution
        run: dotnet build PedroOS.slnx --no-restore -c Release

      - name: Run .NET Unit Tests
        run: dotnet test tests/PedroOS.Tests/PedroOS.Tests.csproj --no-build -c Release --verbosity normal

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
