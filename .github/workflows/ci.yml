name: CI & Deploy (GitHub Pages)
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:client
      - run: dotnet restore PedroOS.slnx
      - run: dotnet build PedroOS.slnx --no-restore -c Release
      - run: dotnet test tests/PedroOS.Tests/PedroOS.Tests.csproj --no-build -c Release
      - run: npx playwright install --with-deps chromium
      - name: Test local development server
        run: npm run test:e2e
        env:
          CI: true
      - name: Export static site
        run: npm run export:pages -- --base "/${{ github.event.repository.name }}" --site "https://${{ github.repository_owner }}.github.io"
      - name: Test actual static site without a backend
        run: npm run test:static
        env:
          CI: true
          PEDROOS_TEST_BASE: /${{ github.event.repository.name }}
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages
  deploy:
    needs: build-and-test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish static site
        id: deployment
        uses: actions/deploy-pages@v4
