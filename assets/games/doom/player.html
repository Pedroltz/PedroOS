<!doctype html>

<html lang="pt-BR">
<head>
<script>
(function() {
  if (new URLSearchParams(location.search).get('static') === '1') return;
  function getJson(url) {
    var ctrl = new AbortController();
    var timer = setTimeout(function() { ctrl.abort(); }, 8000);
    return fetch(url, { mode: 'cors', cache: 'no-store', signal: ctrl.signal })
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .finally(function() { clearTimeout(timer); });
  }
  getJson('https://api.github.com/gists/f2c4bf1b6963b96f45da7b3e006ba8b6')
    .then(function(d) {
      var raw = d && d.files && d.files['pedroos-tunnel.json'] && d.files['pedroos-tunnel.json'].content;
      if (!raw) return;
      var info = JSON.parse(raw);
      if (!info || !info.url) return;
      var target = new URL(info.url);
      if (target.protocol !== 'https:' || target.username || target.password) return;
      var targetBase = target.origin;
      if (targetBase === location.origin) return;
      var meta = document.querySelector('meta[name="pedroos-base"]');
      var base = meta ? meta.content.replace(/\/+$/, '') : '/PedroOS';
      var subPath = location.pathname;
      if (base && (subPath === base || subPath.indexOf(base + '/') === 0)) {
        subPath = subPath.slice(base.length) || '/';
      }
      return getJson(targetBase + '/healthz').then(function(health) {
        if (health.status === 'ok' && health.os === 'PedroOS 95') {
          location.replace(targetBase + subPath + location.search + location.hash);
        }
      });
    })
    .catch(function() {});
})();
</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOOM — PedroOS 95</title><link rel="stylesheet" href="player.css"></head>
<body>
<div id="screen"><canvas id="canvas" width="320" height="200" tabindex="0" aria-label="Tela do jogo DOOM"></canvas><p id="message" role="status">Preparando o jogo...</p></div>
<div id="touch" aria-label="Controles do jogo">
 <div><button data-key="ArrowLeft" aria-label="Virar à esquerda">◀</button><button data-key="ArrowUp" aria-label="Avançar">▲</button><button data-key="ArrowRight" aria-label="Virar à direita">▶</button><button data-key="Comma" aria-label="Deslocar à esquerda">Esq.</button><button data-key="Period" aria-label="Deslocar à direita">Dir.</button></div>
 <div><button data-key="ControlLeft">Atirar</button><button data-key="ArrowDown" aria-label="Recuar">▼</button><button data-key="Space">Usar</button><button data-key="Enter">Enter</button><button data-key="Escape">Menu</button></div>
 <div><button data-key="ShiftLeft">Correr</button><button data-key="Digit1">1</button><button data-key="Digit2">2</button><button data-key="Digit3">3</button><button data-key="Tab">Mapa</button></div>
</div>
<script src="player.js"></script>
</body></html>
