<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NEON FIST — 2D Fighter</title>
<meta name="theme-color" content="#8b7bff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neon Fist">
<link rel="stylesheet" href="player.css">
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="bars">
      <div class="side left">
        <div class="name" id="n1">JOGADOR</div>
        <div class="hpouter"><div class="hpghost" id="g1"></div><div class="hpfill" id="h1"></div></div>
        <div class="meterouter"><div class="meterfill" id="m1"></div></div>
        <div class="pips"><div class="pip" id="p1a"></div><div class="pip" id="p1b"></div></div>
      </div>
      <div class="side right">
        <div class="name" id="n2">CPU</div>
        <div class="hpouter"><div class="hpghost" id="g2"></div><div class="hpfill" id="h2"></div></div>
        <div class="meterouter"><div class="meterfill" id="m2"></div></div>
        <div class="pips"><div class="pip" id="p2a"></div><div class="pip" id="p2b"></div></div>
      </div>
    </div>
    <div id="timer">99</div>
    <div id="combo1"></div><div id="combo2"></div>
    <div id="center"></div><div id="sub"></div>
    <div id="diag"></div>
  </div>
  <div id="touch">
    <div class="zone" id="dpad">
      <div class="key" data-k="crouch" style="grid-area:2/2">↓</div>
      <div class="key" data-k="left"  style="grid-area:1/1/3/2">◀</div>
      <div class="key" data-k="up"    style="grid-area:1/2">PULAR</div>
      <div class="key" data-k="right" style="grid-area:1/3/3/4">▶</div>
    </div>
    <div class="zone" id="btns">
      <div class="key atk" data-k="punch">SOCO</div>
      <div class="key atk" data-k="kick">CHUTE</div>
      <div class="key" data-k="block" style="grid-area:2/1/3/3">DEFESA</div>
    </div>
  </div>
  <div id="loading">
    <div class="lg">NEON FIST</div>
    <div class="lbar"><div class="lfill" id="loadBar"></div></div>
    <div class="llabel" id="loadLabel">STARTING</div>
  </div>
  <div id="boot">
    <h1>NEON FIST</h1>
    <p>MOVE A/D · JUMP W · CROUCH S · PUNCH J · KICK K · BLOCK L<br>
       <b>FIREBALL</b> ↓ ↘ → + P &nbsp;·&nbsp; <b>UPPERCUT</b> → ↓ ↘ + P &nbsp;·&nbsp; <b>SPIN KICK</b> ↓ ↙ ← + K<br>
       Cancel a connected normal straight into a special. P: pausar · Enter: revanche.</p>
    <button class="btn" id="start">Jogar</button>
  </div>
</div>
<script type="module" src="player.js"></script>
</body>
</html>
